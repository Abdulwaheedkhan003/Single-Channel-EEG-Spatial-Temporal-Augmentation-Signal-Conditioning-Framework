<style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.shim{animation:shim 2.5s linear infinite}@keyframes shim{from{transform:translateX(-200px)}to{transform:translateX(200px)}}
.pop{opacity:0;animation:pop .8s ease forwards}@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}</style>
<rect width="880" height="440" rx="14" fill="#010210"/>
