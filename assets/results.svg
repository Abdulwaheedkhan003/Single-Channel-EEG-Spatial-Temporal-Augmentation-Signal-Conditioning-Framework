<rect x="330" y="180" width="525" height="235" rx="10" fill="#0C1030" stroke="#182050"/>
<text class="m" x="352" y="210" font-size="12" fill="#7A8BBE">Nyquist Criterion Verification</text>
<text class="m" xml:space="preserve" x="352" y="242" font-size="12.5"><tspan fill="#7A8BBE">Highest tracked frequency: </tspan><tspan fill="#00CFFF">80 Hz (Gamma)</tspan></text>
<text class="m" xml:space="preserve" x="352" y="263" font-size="12.5"><tspan fill="#7A8BBE">Required Nyquist:          </tspan><tspan fill="#D4DEFF">≥ 160 Hz</tspan></text>
<text class="m" xml:space="preserve" x="352" y="284" font-size="12.5"><tspan fill="#7A8BBE">Sampling rate:             </tspan><tspan fill="#00F5A0">256 Hz &gt; 160 Hz → SATISFIED ✓</tspan></text>
<text class="m" xml:space="preserve" x="352" y="326" font-size="12.5"><tspan fill="#7A8BBE">Samples per wave cycle at 256 Hz:</tspan></text>
<text class="m" xml:space="preserve" x="352" y="347" font-size="12.5"><tspan fill="#00CFFF">Delta </tspan><tspan fill="#D4DEFF">(0.5–4 Hz):  </tspan><tspan fill="#7A8BBE">64 – 512 pts</tspan></text>
<text class="m" xml:space="preserve" x="352" y="368" font-size="12.5"><tspan fill="#00CFFF">Beta  </tspan><tspan fill="#D4DEFF">(12–30 Hz):  </tspan><tspan fill="#7A8BBE">8.5 – 21.3 pts</tspan></text>
<text class="m" xml:space="preserve" x="352" y="389" font-size="12.5"><tspan fill="#00CFFF">Gamma </tspan><tspan fill="#D4DEFF">(30–80 Hz):  </tspan><tspan fill="#7A8BBE">3.2 – 8.5 pts</tspan></text>
