<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img" aria-label="Results: 83.1% (60/40 split), 81.9% (70/30), 80.2% (80/20), 10-fold stratified cross-validation; confusion matrix 71/15/5/73; Nyquist criterion satisfied at 256 Hz">
